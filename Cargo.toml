[workspace]
resolver = "2"
members = ["crates/chaqmoq-runtime", "crates/chaqmoq-cli"]
exclude = ["legacy"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Otabek Ismoilov <ismoilovdev@gmail.com>"]
repository = "https://github.com/ismoilovdevml/chaqmoq"
homepage = "https://github.com/ismoilovdevml/chaqmoq"
description = "Chaqmoq — a fast, secure-by-default JavaScript & TypeScript runtime built on V8 and Rust"
keywords = ["javascript", "typescript", "runtime", "v8", "chaqmoq"]
categories = ["development-tools"]

[workspace.dependencies]
chaqmoq-runtime = { path = "crates/chaqmoq-runtime", version = "0.2.0" }

deno_core = "0.409.0"
deno_error = "0.7"
deno_ast = { version = "0.53", features = ["transpiling"] }

anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
  "tokio",
  "server",
  "server-auto",
  "http1",
  "http2",
] }
notify = "8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "charset",
  "http2",
] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# V8 is enormous; never build it without optimisations, even in dev profiles.
[profile.dev.package.v8]
opt-level = 1
[profile.dev.package.deno_core]
opt-level = 1
