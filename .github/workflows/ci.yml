name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # V8 is huge; keep incremental artefacts out of the cache to save space.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: Run the examples
        shell: bash
        run: |
          cargo run --quiet -- run examples/hello.ts
          cargo run --quiet -- run examples/showcase.ts
          cargo run --quiet -- run --allow-read --allow-write examples/filesystem.ts
          cargo run --quiet -- test examples/tests/

  release:
    name: Release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin chaqmoq

      - name: Package
        shell: bash
        run: |
          name="chaqmoq-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/chaqmoq.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/chaqmoq" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cp -r types "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name")

      - uses: actions/upload-artifact@v4
        with:
          name: chaqmoq-${{ matrix.target }}
          path: dist/*.tar.gz
